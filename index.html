function withLocalProxy(raw){
 if(!raw)return raw;
 try{const u=new URL(raw);u.searchParams.set("local","true");return u.toString()}
 catch(_){return raw+(String(raw).includes("?")?"&":"?")+"local=true"}
}
function localLatestVersionUrl(videoId,stream){

}

  const script=document.createElement("script");
  let settled=false;
  const finish=(fn,value)=>{if(settled)return;settled=true;clearTimeout(timer);fn(value)};
  const timer=setTimeout(()=>finish(reject,Error("انتهت مهلة تحميل "+label+" من "+new URL(url).host)),12000);
  script.src=url;script.async=true;script.crossOrigin="anonymous";
  script.onload=()=>check()?finish(resolve):finish(reject,Error("تم تحميل الملف لكن "+label+" غير متاح"));
  script.onerror=()=>finish(reject,Error("تعذر تحميل "+label+" من "+new URL(url).host));
  document.head.appendChild(script);
 });

function ensureShaka(){

  ];
  const errors=[];
  for(const url of sources){
   try{
    await loadScript(url,()=>!!window.shaka?.Player,"Shaka Player");

   }catch(e){errors.push(e.message||String(e))}

}

  }

async function api(path){
 const ordered=[API,...API_SERVERS.filter(server=>server!==API)];
 const failures=[];
 let bestData=null,bestScore=-1,bestServer=null;
 for(const server of ordered){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),10000);
  try{
   const response=await fetch(server+path,{
    signal:controller.signal,
    headers:{"Accept":"application/json"}
   });
   if(!response.ok)throw Error("HTTP "+response.status);
   const data=await response.json();
   if(path.startsWith("/videos/")){
    const progressive=Array.isArray(data.formatStreams)?data.formatStreams.length:0;
    const video=Array.isArray(data.videoStreams)?data.videoStreams.length:0;
    const adaptive=Array.isArray(data.adaptiveFormats)?data.adaptiveFormats.length:0;
    const dash=!!data.dashUrl;
    const hls=!!data.hlsUrl;
    const score=progressive*1000+video*100+Number(dash)*20+Number(hls)*15+Math.min(adaptive,100)*0.01;
    if(score>bestScore){
     bestData=data;
     bestScore=score;
     bestServer=server;
    }
    if(progressive>0){
     API=server;
     return data;
    }
   }else{
    API=server;
    return data;
   }
  }catch(error){
   failures.push(server.replace("/api/v1","")+": "+(error.name==="AbortError"?"انتهت المهلة":error.message||String(error)));
  }finally{
   clearTimeout(timer);
  }
 }
 if(bestData){
  API=bestServer;
  return bestData;
 }
 throw Error("تعذر الاتصال بخوادم Invidious المعتمدة: "+failures.join(" | "));
}

function waitForMediaReady(player,timeout=20000){
 return new Promise((resolve,reject)=>{
  if(player.readyState>=2){resolve();return}
  let done=false;
  const cleanup=()=>{clearTimeout(timer);player.removeEventListener("loadeddata",ready);player.removeEventListener("canplay",ready);player.removeEventListener("playing",ready);player.removeEventListener("error",failed)};
  const finish=(fn,value)=>{if(done)return;done=true;cleanup();fn(value)};
  const ready=()=>{if(player.readyState>=2)finish(resolve)};
  const failed=()=>finish(reject,Error("تعذر تحميل بيانات الفيديو: "+(player.error?.message||"خطأ في مصدر البث")));
  const timer=setTimeout(()=>finish(reject,Error("انتهت مهلة انتظار بيانات الفيديو؛ تم تحميل المشغل لكن لم تصل بيانات قابلة للتشغيل")),timeout);
  player.addEventListener("loadeddata",ready);player.addEventListener("canplay",ready);player.addEventListener("playing",ready);player.addEventListener("error",failed);
 });
}

  const fail=(title,reason,extra={})=>showPlayerError(title,{
   reason,formatStreamsCount:formatStreams.length,videoStreamsCount:videoStreams.length,
   adaptiveFormatsCount:adaptiveFormats.length,dashUrlPresent:!!data.dashUrl,hlsUrlPresent:!!data.hlsUrl,
   formatStreams:formatStreams.map(summarize),videoStreams:videoStreams.map(summarize),
   adaptiveFormats:adaptiveFormats.map(summarize),apiFields:Object.keys(data||{}),...extra
  });

  // 1) DASH: يفصل الصوت والصورة ويزامنهما داخل محرك التشغيل، مع إبقاء واجهة HTML5 الأصلية.

    shakaEngine.addEventListener("error",event=>{
     const e=event.detail||{};
     dashFailure={code:e.code||null,category:e.category||null,severity:e.severity||null,data:e.data||null};
    });
    await shakaEngine.load(withLocalProxy(data.dashUrl));
    refreshQualityChoices();applyQualityPreference();
    if(current?.id!==id)return;
    await waitForMediaReady(player,20000);
    if(current?.id!==id)return;
    playbackMode="dash";message.style.display="none";
    player.play().catch(e=>{if(current?.id===id)showPlayerError("تم تحميل DASH لكن تعذر بدء التشغيل",{message:e.message,...mediaErrorDetails(player)})});
    return;
   }catch(e){dashFailure={message:e.message||String(e),name:e.name||"Error"};if(shakaEngine){try{await shakaEngine.destroy()}catch(_){}shakaEngine=null}console.warn("DASH failed",e)}

  if(data.hlsUrl && window.shaka){

    });
    await shakaEngine.load(withLocalProxy(data.hlsUrl));

    player.play().catch(e=>{if(current?.id===id)showPlayerError("تم تحميل HLS لكن تعذر بدء التشغيل",{message:e.message,...mediaErrorDetails(player),hlsUrlPresent:true,playbackMode})});
    return;
   }catch(e){

   }
  }

  if(data.hlsUrl){
   try{

   if(current?.id!==id)return;
   try{

    return;
   }catch(e){
    directFailures.push({
     stream:summarize(stream),
     error:e.message||String(e),
     media:mediaErrorDetails(player)
    });
   }
  }
  const videoAdaptive=adaptiveFormats.filter(x=>x?.url&&/^video\//i.test(String(x.type||"")));
  const audioAdaptive=adaptiveFormats.filter(x=>x?.url&&/^audio\//i.test(String(x.type||"")));

   shakaLoadError?"الخادم وفّر روابط DASH وHLS، لكن تعذر تحميل Shaka Player من مصادر المكتبة المتاحة.":"هذا الفيديو لا يحتوي على MP4 مدمج. توجد مسارات adaptive منفصلة؛ لا يمكن وضع رابط الفيديو وحده في video.src لأنه سيكون بلا صوت. يلزم dashUrl صالح أو manifest يجمع المسارين.",
   {videoAdaptiveCount:videoAdaptive.length,audioAdaptiveCount:audioAdaptive.length,
    videoTypes:[...new Set(videoAdaptive.map(x=>x.type))],audioTypes:[...new Set(audioAdaptive.map(x=>x.type))],

    dashUrlLocalProxy:withLocalProxy(data.dashUrl),
    hlsUrlHost:(()=>{try{return new URL(withLocalProxy(data.hlsUrl)).host}catch{return null}})(),
    hlsUrlLocalProxy:withLocalProxy(data.hlsUrl),
    playbackEngines:{shaka:!!window.shaka,hlsjs:!!window.Hls},shakaLoadError,hlsLoadError:hlsLoadPromise?null:(!window.Hls&&data.hlsUrl?"لم يتم تحميل hls.js أو لم يتم اختباره":null),dashFailure,hlsFailure,
    mediaState:mediaErrorDetails(player),directCandidatesTried:unique.length,directFailures,

 }catch(error){if(current?.id===id)showPlayerError("تعذر جلب أو تهيئة مصادر الفيديو من خادم Invidious",{name:error.name||"Error",message:error.message||String(error),api:API+"/videos/"+id,browser:navigator.userAgent,shaka:!!window.shaka,hlsjs:!!window.Hls,shakaLoadPromise:!!shakaLoadPromise,hlsLoadPromise:!!hlsLoadPromise})}
}

    const el=document.documentElement;
    try{
      if(el.requestFullscreen){await el.requestFullscreen();requested=true;}
      else if(el.webkitRequestFullscreen){el.webkitRequestFullscreen();requested=true;}
    }catch(e){}
  }
  document.addEventListener('click',function(e){
    if(e.target.closest('button,[role="button"],.player-box')) enterFullscreen();
  },true);
  document.addEventListener('fullscreenchange',function(){
    if(!document.fullscreenElement) requested=false;
  });
  document.addEventListener('webkitfullscreenchange',function(){
    if(!document.webkitFullscreenElement) requested=false;
  });
})();
setupNativePlayer();
</script>
</body>
</html>
